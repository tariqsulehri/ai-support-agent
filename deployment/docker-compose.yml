services:

  web-ai-agent:
    image: tariqsulehri/web-ai-agent:latest
    platform: linux/amd64
    container_name: web-ai-agent
    restart: unless-stopped
    env_file:
      - .env.web-agent
    environment:
      NODE_ENV: production
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3060:3000"
    volumes:
      - web_ai_agent_data:/app/data
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/voice', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  web_ai_agent_data:
